<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">CYBER•GOMOKU</div>
            <div id="connection-status" class="status-badge offline">OFFLINE</div>
        </header>

        <main>
            <div class="game-area">
                <div class="player-panel left" id="player-black">
                    <div class="avatar-container">
                        <div class="avatar-ring"></div>
                        <img src="" alt="Black" class="avatar" id="avatar-black">
                        <div class="turn-indicator"></div>
                    </div>
                    <div class="info">
                        <div class="name" id="name-black">WAITING...</div>
                        <div class="status" id="status-black"></div>
                        <button id="btn-ready-black" class="cyber-btn hidden">READY</button>
                    </div>
                </div>

                <div class="board-container">
                    <div id="board" class="board">
                        <!-- Grid cells will be generated by JS -->
                    </div>
                    <div id="winner-modal" class="modal hidden">
                        <div class="modal-content">
                            <h2 id="winner-text">BLACK WINS</h2>
                            <button id="btn-reset" class="cyber-btn">REMATCH</button>
                        </div>
                    </div>
                </div>

                <div class="player-panel right" id="player-white">
                    <div class="avatar-container">
                        <img src="" alt="White" class="avatar" id="avatar-white">
                        <div class="turn-indicator"></div>
                    </div>
                    <div class="info">
                        <div class="name" id="name-white">WAITING...</div>
                        <div class="status" id="status-white"></div>
                        <button id="btn-ready-white" class="cyber-btn hidden">READY</button>
                    </div>
                </div>
            </div>
            
            <div class="spectator-area">
                <h3>SPECTATORS</h3>
                <ul id="spectator-list"></ul>
            </div>
        </main>

        <footer>
            <div class="user-identity">
                <img id="my-avatar" src="" alt="Me">
                <span id="my-name">Identifying...</span>
                <span id="my-role" class="role-badge">SPECTATOR</span>
            </div>
        </footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js?v=2"></script>
</body>
</html>
